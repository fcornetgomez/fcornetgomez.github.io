# Líneas de investigación.
# Cada línea empieza por "- titulo:".
#   resumen:  texto corto de la tarjeta de la portada.
#   texto:    explicación más larga para la página «Investigación» (admite Markdown).
#   temas:    lista de temas concretos (cada uno en una línea que empieza por "    - ").
#   diagrama: dibujo que acompaña a la línea. Puede ser:
#             sabor (corriente neutra con cambio de sabor), g-2 (corrección de vértice),
#             colisionador (e+e- → ZH), topologia (universo toroidal)

- titulo: Sabor y violación de CP en modelos con dos dobletes de Higgs
  diagrama: sabor
  resumen: |
    Cómo controlar las corrientes neutras con cambio de sabor en extensiones
    del sector escalar del Modelo Estándar.
  texto: |
    Añadir un segundo doblete de Higgs es una de las extensiones más naturales del
    Modelo Estándar, pero abre la puerta a corrientes neutras con cambio de sabor
    (FCNC) mediadas por escalares a nivel árbol, muy restringidas por los
    experimentos. Estudio simetrías y estructuras de sabor que las mantienen bajo
    control —o las eliminan por completo— de forma estable bajo la evolución del
    grupo de renormalización, y cómo las nuevas fases de violación de CP podrían
    tener un origen común en los sectores de quarks y leptones. Estos modelos
    también pueden explicar a la vez las anomalías de los momentos magnéticos
    del muon y del electrón (g−2).
  temas:
    - Modelos BGL generalizados con FCNC controladas
    - Conservación general del sabor (gFC) y su estabilidad bajo el grupo de renormalización
    - Modelos con simetrías de sabor y su fenomenología en el LHC
    - Origen común de las fases de CP de las matrices CKM y PMNS
    - Momentos magnéticos anómalos de los leptones, (g−2)<sub>μ</sub> y (g−2)<sub>e</sub>

- titulo: Física en futuros colisionadores
  diagrama: colisionador
  resumen: |
    Qué pueden aprender las futuras factorías de Higgs, electrodébiles y del
    top sobre la física más allá del Modelo Estándar.
  texto: |
    Los próximos colisionadores electrón–positrón (lineales o circulares, como el FCC
    del CERN) medirán las propiedades del bosón de Higgs, de los bosones W y Z y del
    quark top con una precisión sin precedentes. Trabajo en la descripción de nueva
    física mediante teorías efectivas (SMEFT) y en las restricciones que estos
    proyectos impondrán a los operadores del sector del top, y participo en los
    estudios europeos de preparación de estas máquinas.
  temas:
    - Restricciones sobre operadores del quark top en futuros colisionadores
    - Análisis de sensibilidad del sector del top en teorías efectivas
    - Estudio ECFA de factorías de Higgs, electrodébiles y del top
    - Visión del colisionador lineal (Linear Collider Facility en el CERN)

- titulo: Topología del Universo
  diagrama: topologia
  resumen: |
    ¿Tiene el Universo una forma no trivial? Buscamos su huella en el fondo
    cósmico de microondas.
  texto: |
    Si el espacio tuviera una topología no trivial —por ejemplo, la de un toro—, el
    fondo cósmico de microondas (CMB) mostraría correlaciones características, como
    pares de círculos o violaciones de isotropía y de paridad. En la colaboración
    COMPACT calculamos los modos propios y las matrices de correlación de distintos
    espacios, estudiamos su detectabilidad y desarrollamos técnicas de aprendizaje
    automático para reconocer la forma del Universo.
  temas:
    - Modos propios y matrices de correlación de espacios con topología no trivial
    - Detectabilidad, anomalías del CMB y violación de paridad
    - Clasificación de topologías con aprendizaje automático (machine learning)
