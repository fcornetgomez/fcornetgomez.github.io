# Texto de presentación de la portada (admite Markdown: **negrita**, [enlace](url)).
presentacion: |
  Soy físico teórico de partículas (fenomenología) en el Departamento de Física
  de la Universidad de Córdoba, donde formo parte del grupo
  [FQM-429](https://www.uco.es/investiga/grupos/acp/). Trabajo en la física del
  **sabor** y la violación de **CP** en modelos con dos dobletes de Higgs, en las
  anomalías de los momentos magnéticos de los leptones (**g−2**) y en lo que los
  **futuros colisionadores** pueden decirnos sobre el quark top y el bosón de Higgs.

  También me interesa la cosmología: en la colaboración **COMPACT** buscamos la
  **topología del Universo** en el fondo cósmico de microondas, con ayuda del
  aprendizaje automático.
